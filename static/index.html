<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxtral Reader</title>
<link rel="stylesheet" href="/static/css/app.css">
<script type="module" src="/static/js/main.js"></script>
</head>
<body>

<!-- ── Header ── -->
<header class="pywebview-drag-region">
  <div class="window-controls">
    <button class="wc-btn wc-close"    id="btn-wc-close"    title="Close"></button>
    <button class="wc-btn wc-minimize" id="btn-wc-minimize" title="Minimize"></button>
  </div>

  <span class="logo pywebview-drag-region">&#9654; Voxtral Reader</span>

  <label class="btn primary" style="cursor:pointer;">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
      <path d="M8 1a.75.75 0 0 1 .75.75v5.5h5.5a.75.75 0 0 1 0 1.5h-5.5v5.5a.75.75 0 0 1-1.5 0v-5.5H1.75a.75.75 0 0 1 0-1.5h5.5V1.75A.75.75 0 0 1 8 1z"/>
    </svg>
    Open PDF
    <input type="file" id="file-input" accept=".pdf" style="display:none">
  </label>

  <label class="toggle-row">
    <input type="checkbox" id="include-refs"> Include References
  </label>

  <button class="btn" id="btn-books" title="Read current Books page aloud">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
      <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.746c-.917-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492V2.687zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783z"/>
    </svg>
    Read Books
  </button>

  <span class="file-name pywebview-drag-region" id="file-name">No file loaded</span>

  <span class="header-sep pywebview-drag-region"></span>

  <span id="status-dot" title="TTS server status"></span>
  <span id="status-label" style="font-size:12px;color:var(--muted)">checking server…</span>

  <button class="wc-pin pinned" id="btn-pin" title="Toggle always on top">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
      <path d="M9.828.722a.5.5 0 0 1 .354.146l4.95 4.95a.5.5 0 0 1 0 .707c-.48.48-1.072.588-1.503.588-.177 0-.335-.018-.46-.039l-3.134 3.134a5.927 5.927 0 0 1 .16 1.013c.046.702-.032 1.687-.72 2.375a.5.5 0 0 1-.707 0l-2.829-2.828-3.182 3.182c-.195.195-1.219.902-1.414.707-.195-.195.512-1.22.707-1.414l3.182-3.182-2.828-2.829a.5.5 0 0 1 0-.707c.688-.688 1.673-.767 2.375-.72a5.922 5.922 0 0 1 1.013.16l3.134-3.133a2.772 2.772 0 0 1-.04-.461c0-.43.108-1.022.589-1.503a.5.5 0 0 1 .353-.146z"/>
    </svg>
  </button>
</header>

<!-- ── Main ── -->
<div class="main">

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-tabs">
      <button class="tab-btn active" data-tab="sections">Sections</button>
      <button class="tab-btn"        data-tab="history">History</button>
    </div>
    <div id="section-list" class="tab-panel active">
      <div style="padding:20px 14px;color:var(--muted);font-size:12px;">
        Open a PDF to see sections
      </div>
    </div>
    <div id="history-list" class="tab-panel">
      <div id="history-empty" style="padding:20px 14px;color:var(--muted);font-size:12px;">
        No documents loaded yet
      </div>
    </div>
    <div class="sidebar-footer">
      <span id="cache-size" title="Generated audio kept on disk so re-reading is instant">Audio cache: —</span>
      <button class="link-btn" id="btn-clear-cache" title="Delete all cached audio">Clear</button>
    </div>
  </aside>

  <!-- Reader -->
  <div id="reader">
    <div class="empty-state" id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <p>Open a scientific PDF to begin</p>
      <small>Citations stripped &bull; Math cleaned &bull; Abbreviations expanded</small>
    </div>
    <div id="chunks-container"></div>
  </div>

</div>

<!-- ── Player ── -->
<div id="player">

  <button class="ctrl-btn" id="btn-prev" title="Previous paragraph" disabled>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
      <path d="M3.5 3.5a.5.5 0 0 1 .5.5v3.793l8.146-4.573A.5.5 0 0 1 13 3.5v9a.5.5 0 0 1-.854.359L4 8.207V12a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5z"/>
    </svg>
  </button>

  <button class="ctrl-btn" id="btn-play-pause" title="Play / Pause" disabled>
    <svg id="icon-play" width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
      <path d="M11.596 8.697L4.5 12.5V3.5l7.096 5.197z"/>
    </svg>
    <svg id="icon-pause" width="18" height="18" viewBox="0 0 16 16" fill="currentColor" style="display:none">
      <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>
    </svg>
  </button>

  <button class="ctrl-btn" id="btn-stop" title="Stop &amp; clear generation queue" disabled>
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
      <rect x="3" y="3" width="10" height="10" rx="1"/>
    </svg>
  </button>

  <button class="ctrl-btn" id="btn-next" title="Next paragraph" disabled>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
      <path d="M12.5 3.5a.5.5 0 0 0-.5.5v3.793L3.854 3.22A.5.5 0 0 0 3 3.578v9a.5.5 0 0 0 .854.359L11 8.207V12a.5.5 0 0 0 1 0V4a.5.5 0 0 0-.5-.5z"/>
    </svg>
  </button>

  <div class="progress-wrap">
    <div class="progress-track" id="progress-track">
      <div id="chunk-progress"></div>
      <div id="progress-fill" style="width:0%"></div>
    </div>
    <div class="progress-info">
      <span id="progress-label">—</span>
      <span id="section-label" style="color:var(--muted);font-size:11px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    </div>
  </div>

  <div class="loading-spinner" id="spinner"></div>

  <span class="rtf-indicator" id="rtf-indicator" title="Real-time factor — seconds of audio generated per second of compute. >1× means faster than real-time.">—</span>

  <span class="player-label">Voice</span>
  <select class="player-select" id="voice-select" style="width:148px;">
    <option value="casual_male">casual_male</option>
    <option value="casual_female">casual_female</option>
    <option value="cheerful_female">cheerful_female</option>
    <option value="neutral_male">neutral_male</option>
    <option value="neutral_female">neutral_female</option>
    <option value="fr_male">fr_male</option>
    <option value="fr_female">fr_female</option>
    <option value="es_male">es_male</option>
    <option value="es_female">es_female</option>
    <option value="de_male">de_male</option>
    <option value="de_female">de_female</option>
    <option value="it_male">it_male</option>
    <option value="it_female">it_female</option>
    <option value="pt_male">pt_male</option>
    <option value="pt_female">pt_female</option>
    <option value="nl_male">nl_male</option>
    <option value="nl_female">nl_female</option>
    <option value="ar_male">ar_male</option>
    <option value="hi_male">hi_male</option>
    <option value="hi_female">hi_female</option>
  </select>

  <span class="player-label">Speed</span>
  <select class="player-select" id="speed-select">
    <option value="0.75">0.75×</option>
    <option value="1" selected>1×</option>
    <option value="1.25">1.25×</option>
    <option value="1.5">1.5×</option>
    <option value="1.75">1.75×</option>
    <option value="2">2×</option>
  </select>

</div>

<div id="toast"></div>

</body>
</html>
