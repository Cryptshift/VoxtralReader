[project]
name = "voxtral-reader"
version = "0.2.0"
description = "Read PDFs and Apple Books pages aloud with Voxtral TTS, locally on Apple Silicon."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # Web app
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.31.1",
    "httpx>=0.27.2",
    "python-multipart>=0.0.22",
    # PDF extraction
    "pymupdf>=1.27.2.3",
    # TTS server. mlx-audio changes its server API between minor versions,
    # so it is pinned exactly. The "tts" extra brings mistral-common[audio],
    # which Voxtral's tokenizer needs.
    "mlx-audio[tts]==0.5.8",
    # mlx_audio.server imports `webrtcvad`. mlx-audio's "server" extra would
    # pull plain webrtcvad, which has to be compiled (and needs setuptools'
    # pkg_resources); this fork ships prebuilt wheels of the same module.
    # The other server deps (fastapi, uvicorn, python-multipart) are above.
    "webrtcvad-wheels>=2.0.14.post1",
    # Desktop window (run.py)
    "pywebview>=6.2.1",
    # Books mode: Quartz (window capture), Vision (OCR), AppKit (Cocoa)
    "pyobjc-core>=12.1",
    "pyobjc-framework-cocoa>=12.1",
    "pyobjc-framework-quartz>=12.1",
    "pyobjc-framework-vision>=12.1",
]

[dependency-groups]
dev = ["pytest>=9.0.2"]

[tool.uv]
# An application, not a library: install dependencies only.
package = false
# MLX and the pyobjc frameworks only make sense on Apple Silicon Macs.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
